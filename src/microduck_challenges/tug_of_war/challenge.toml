# The Tug of War: two ducks neck to neck over a pit, each pulling by walking
# backwards; the pit decides. The learner starts as the Arena's reference duck
# and trains against it; it peaks early (t10: 500 of 1000), so keep the best
# checkpoint, not the last.
event = "tug-of-war"
task  = "Mjlab-TugOfWar-MicroDuck"
kind  = "perpetual"

# What the policy reads in each command group: publish writes it in the manifest.
[command]
twist = "[vx: the Arena sends -0.30 m/s, walk backwards; unused; unused]"

[recipe]                  # the first training, as is
num_envs       = 4096
max_iterations = 1000
seed           = 1

[params.pull_reward]
label = "Win ground"
value = 4.0
min   = 0.5
max   = 5.0

[params.back_reward]
label = "Walk backwards"
value = 3.0
min   = 0.0
max   = 4.0

[params.upright_reward]
label = "Keep the trunk level"
value = 1.0
min   = 0.0
max   = 4.0

# 0 lets the duck crouch, sit or lie as the Arena allows; above 0, going down (trunk
# under 7 cm or tilted past 45° for 0.3 s) ends the training episode and costs that
# many pits.
[params.stay_upright]
label = "Stay upright"
value = 1.0
min   = 0.0
max   = 2.0
